# recagent 环境
# 用法:
#   conda env create -f environment.yml
#   conda activate recagent
#
# 注意: torch 单独装, 因为要匹配 CUDA 版本。
# RTX 3060 Laptop -> cu121 (torch 2.5.1), 装完验证:
#   python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
# 期望输出: 2.5.1 12.1 True
#
# 若显存紧张, 可改用 cu118 版本以节省显存占用。

name: recagent

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip>=24.0
  - git
  - pip:
      # --- torch: 按需改 cu121 / cu118，见文件头说明 ---
      - torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
      - torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu121
      # --- 基础 ---
      - numpy>=1.26,<2.2
      - pandas>=2.2
      - scipy>=1.13
      - scikit-learn>=1.5
      - pyyaml>=6.0
      - tqdm>=4.66
      - loguru>=0.7
      - hydra-core>=1.3
      - pydantic>=2.7
      # --- 开发工具 ---
      - pytest>=8.2
      - pytest-cov>=5.0
      - ruff>=0.6
      - mypy>=1.11
      - pre-commit>=3.7
      - nbstripout>=0.7
      - mlflow>=2.15

# 国内加速（pip 阿里云源已在你机器上配置）。
# HuggingFace 下载请设置:
#   $env:HF_ENDPOINT = "https://hf-mirror.com"
