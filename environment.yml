# recagent 环境定义
#
# ══════════════════════════════════════════════════════════════════════
# 方式一（推荐）：复用已有的 llm-lab 环境，不重复下载 2GB 的 torch
# ══════════════════════════════════════════════════════════════════════
# 你的 llm-lab 环境已具备 Python 3.11 + torch cu126 + CUDA 可用 + pandas，
# 只缺开发工具。直接补装即可：
#
#   conda activate llm-lab
#   pip install -e ".[dev]"
#   python scripts/env_check.py
#
# ══════════════════════════════════════════════════════════════════════
# 方式二：新建独立的 recagent 环境
# ══════════════════════════════════════════════════════════════════════
#   conda env create -f environment.yml
#   conda activate recagent
#   python scripts/env_check.py
#
# 注意：torch 已从本文件中移除，必须单独安装。
# 原因：pip 段里的 --index-url 是全局参数，会作用到后续所有包，
# 导致 numpy/pandas 等跑去 PyTorch 源上找而失败。
# PyTorch 官方索引只含 torch 相关包。
#
# RTX 3060 Laptop 请从 conda 装 CUDA 版 torch（比 pip 更省心）：
#
#   conda activate recagent
#   conda install pytorch torchvision pytorch-cuda=12.1 -c pytorch -c nvidia
#
# 或走 pip（cu121 对应 CUDA 12.1）：
#
#   pip install torch==2.5.1 torchvision==0.20.1 \
#       --index-url https://download.pytorch.org/whl/cu121
#
# 装完验证（必须输出 True）：
#   python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
# ══════════════════════════════════════════════════════════════════════

name: recagent

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip>=24.0
  - git
  - pip:
      # --- 基础数据处理 ---
      # 不设 numpy 上限：torch 2.14 针对 numpy 2.x 编译，钉在 <2.2 会降级并报错
      - numpy>=1.26
      - pandas>=2.2
      - scipy>=1.13
      - scikit-learn>=1.5
      - pyyaml>=6.0
      - tqdm>=4.66
      # --- 配置与校验 ---
      - hydra-core>=1.3
      - pydantic>=2.7
      # --- 开发工具 ---
      - pytest>=8.2
      - pytest-cov>=5.0
      - ruff>=0.6
      - mypy>=1.11
      - pre-commit>=3.7
      - nbstripout>=0.7
      - mlflow>=2.15
      # 说明：本项目日志使用标准库 logging（见 recagent/utils/logging.py），
      # 不依赖 loguru。ADR-009 记录了为什么不用 loguru。

# 国内加速（你的机器已配置 pip 阿里云源）。
# HuggingFace 下载（S4 微调阶段用）需要设置镜像：
#   $env:HF_ENDPOINT = "https://hf-mirror.com"
