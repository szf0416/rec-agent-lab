[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recagent"
version = "0.1.0"
description = "从零构建推荐系统到 LLM 推荐 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# 依赖策略：按阶段逐步解注释，避免一开始就装一大堆用不到的东西。
# 每加入一个依赖，在 docs/DECISIONS.md 记一条理由。
dependencies = [
    # --- S0/S1: 基础 ---
    # 版本下限对齐 llm-lab 实测环境（numpy 2.4.6 / pandas 3.0.6）。
    # 不设上限：torch 2.14 是针对 numpy 2.x 编译的，
    # 若把 numpy 钉在 <2.2，pip install -e 会降级 numpy 并导致运行时报错。
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "pydantic>=2.7",
    # --- 训练（torch 由 environment.yml 按 CUDA 版本单独安装） ---
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# S3: 推荐模型与检索
rec = [
    "implicit>=0.7",
    "faiss-cpu>=1.8",
]
# S4: LLM 微调
llm = [
    "transformers>=4.44",
    "peft>=0.13",
    "trl>=0.11",
    "datasets>=2.20",
    "accelerate>=0.34",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
    "sentencepiece>=0.2",
]
# S5: 服务与部署
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "prometheus-client>=0.20",
]
# S6: Agent
agent = [
    "langgraph>=0.2",
    "langfuse>=2.50",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "mlflow>=2.15",
]

[project.scripts]
recagent = "recagent.__main__:main"

[tool.setuptools.packages.find]
include = ["recagent*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# .tools 是沙箱内 pip --target 装的本地工具，不是项目代码；
# data/ 是数据产物目录，都不参与 lint。
#
# *.md 也必须排除：ruff 会去格式化 Markdown 里嵌的 Python 代码块，
# 而那些示例是为了讲解（注释对齐、刻意展示错误写法），
# 不是可执行代码，被 formatter 重排会破坏表达意图。
extend-exclude = ["notebooks", "from_scratch", ".tools", "data", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "E501",     # 行长由 formatter 负责，硬拆中文行反而更难读
    # RUF001/002/003 禁止「有歧义的 Unicode 字符」，而中文全角标点（，：（））
    # 正好被判为歧义。本项目文档与注释一律中文，这三条必然误报，故关闭。
    "RUF001",   # 字符串中的歧义字符
    "RUF002",   # docstring 中的歧义字符
    "RUF003",   # 注释中的歧义字符
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"from_scratch/*" = ["E402", "F401"]   # 教学代码允许渐进式演示

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# 本项目只对库代码做严格类型检查。
# tests/ 里的测试函数大量返回 None 且使用 fixture，逐一声明收益低；
# 需要类型保障的地方是 recagent/ 这个会被反复复用的包。
files = ["recagent"]
exclude = ["from_scratch/", "notebooks/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: 标记慢测试（需要大数据或 GPU），默认不跑",
    "gpu: 需要 CUDA 的测试",
]
filterwarnings = ["ignore::DeprecationWarning"]
